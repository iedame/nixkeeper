name: Track a package
description: Ask for a nixpkgs package to be added to one of this dashboard's lists.
title: "Track <attribute>"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This dashboard tracks packages its maintainers look after. To track your own packages, you can [set up a dashboard of your own](https://github.com/iedame/nixkeeper/blob/main/docs/your-own-instance.md) instead.
  - type: input
    id: attribute
    attributes:
      label: nixpkgs attribute
      description: As in nixpkgs, e.g. `wesnoth-devel` or `haskellPackages.pandoc`.
      placeholder: wesnoth-devel
    validations:
      required: true
  - type: input
    id: list
    attributes:
      label: Which list
      description: The list it belongs on, e.g. `gaming` (the list names are under the counts on the page).
      placeholder: gaming
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: Who looks after it, or why it belongs on that list.
