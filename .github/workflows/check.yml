name: Check

on:
  push:
    branches: [main]  # not data: the daily sync pushes there
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Run flake checks (builds nixkeeper, which runs its tests)
        run: nix flake check
