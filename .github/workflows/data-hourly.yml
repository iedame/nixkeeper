name: "Data: hourly updates (frequent packages, update PRs)"

# Updates part of the package data hourly, on top of the sync (data-daily.yml:
# every 3 hours on the community instance, daily elsewhere), against the last
# published data:
#   frequent-check: the update checks marked `frequent = true` in
#     package-lists/update-checks.nix (nixkeeper/frequent.py)
#   pr-check: outdated packages' update PRs, open and merged into master
#     (nixkeeper/prcheck.py)
# One workflow, one commit: both change little, and most hours nothing, so
# most runs push nothing.

on:
  schedule:
    # Hourly, at :23 to stay clear of the top of the hour, when GitHub's
    # scheduler is busiest. Scheduled runs are best-effort: under load GitHub
    # delays or skips them, so gaps of a few hours happen (every 4 to 7
    # hours on 2026-10-05/06). The fallback when nothing starts it at :15
    # (scripts/start-runs.sh): a run started both ways finds nothing new.
    - cron: '23 * * * *'
  workflow_dispatch: {}

# The sync pushes to the data branch too: never at the same time. (Only
# one run can wait per group; a second waiting run would cancel it, which is
# why these checks share one workflow instead of two.)
concurrency:
  group: data-branch
  cancel-in-progress: false

permissions:
  contents: write
  issues: write  # the status issue (nixkeeper/notify.py)
  # The PR searches: without it they silently come back as issue searches
  # (see data-daily.yml).
  pull-requests: read

jobs:
  hourly-updates:
    runs-on: ubuntu-latest
    # Usually 2 minutes. A run that hangs would hold the data branch (and
    # the sync waiting for it) up to GitHub's default of 6 hours.
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      # Same as the sync: main's current code, with the last published
      # data (which the sync has to have made first).
      - name: Restore the last published data, on main
        id: restore
        run: bash scripts/data-branch.sh restore --required

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Frequent update checks
        run: nix run .#frequent-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # GitHub tag checks, status issue
          NIXKEEPER_NOTIFY: github-issue  # the status issue; local runs don't notify

      - name: Update PRs
        # Also when the frequent checks failed: they're independent.
        if: ${{ !cancelled() }}
        run: nix run .#pr-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # PR searches, status issue
          NIXKEEPER_NOTIFY: github-issue

      - name: Publish the data if it changed
        id: publish
        # After a failed check too, but never without the restored data.
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: |
          bash scripts/data-branch.sh publish "hourly: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      # The page with this data, to Cloudflare (a Worker serving them as
      # static assets): only for an instance with one (the community one,
      # nixkeeper.com), and only when the page or the data changed since
      # (scripts/cloudflare.sh).
      - name: Publish to Cloudflare
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        env:
          CLOUDFLARE_WORKER: ${{ vars.CLOUDFLARE_WORKER }}
          CLOUDFLARE_SITE_URL: ${{ vars.CLOUDFLARE_SITE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}  # a secret: kept out of the logs
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash scripts/cloudflare.sh deploy
