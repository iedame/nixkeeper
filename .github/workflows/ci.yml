name: "CI: tests and lint"

# Checks nixkeeper's own code on every push to main and every PR: builds it
# (running its tests) and runs the formatting, lint and package-list checks.

on:
  push:
    branches: [main]  # not data: the daily sync pushes there
  pull_request:

permissions:
  contents: read  # only reads the code, whatever the repository's default

jobs:
  tests-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # never pushes

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      # notifications/ subscribes the handles its files mention to an issue:
      # a pull request may only add its own author, and the handles and
      # teams must be nixos-unstable's (not this flake's lagging nixpkgs).
      - name: "Notifications: known names, only adding yourself"
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          python3 scripts/check-notifications.py "$BASE" "$AUTHOR"

      - name: Run flake checks (builds nixkeeper, which runs its tests)
        run: nix flake check
