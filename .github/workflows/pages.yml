name: "Pages: publish the page"

# Publishes the page (page/) to GitHub Pages whenever it changes on main.
# Needs Settings → Pages → Source: "GitHub Actions". main only changes
# through pull requests that passed CI, so what's published has been checked.
# The data isn't part of it: the page reads that from the data branch.

on:
  push:
    branches: [main]
    paths:
      - 'page/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}  # to publish by hand, e.g. right after switching the source

permissions:
  contents: read

# One publish at a time; a newer one waits rather than cancelling one that's
# halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write     # deploy to Pages
      id-token: write  # prove to Pages that this run is this repository's
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # never pushes

      - name: Package the page
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: page

      - name: Publish it
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
