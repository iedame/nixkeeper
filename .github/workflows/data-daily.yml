name: "Data: sync"

# Updates the package data the page shows (the data branch): everything, from
# every source (nixkeeper/sync.py). Also posts to the status issue. The data
# branch is main plus one commit with the data (scripts/data-branch.sh).
# (The file keeps its old name, data-daily.yml: start-runs and badges use it.)

on:
  schedule:
    # Every 3 hours; each run syncs only when the last sync is due by the
    # instance's interval (SYNC_HOURS below: every 3 hours on the community
    # instance, daily elsewhere), else it stops at once. Also started
    # through the API at :15 from outside GitHub (its schedule skips runs
    # when busy; scripts/start-runs.sh): whichever runs second stops at once.
    - cron: '0 */3 * * *'
  # Lets you trigger a run manually from the Actions tab (always syncs), or
  # through the API with if_older ("auto": by the interval, as scheduled).
  workflow_dispatch:
    inputs:
      if_older:
        description: "Only if the last sync is older than this many hours (empty: always; auto: by the instance's interval)"
        type: string
        default: ""

# The hourly updates (data-hourly.yml) also push to the data branch: never at
# the same time. A run waits for the other instead of cancelling it.
concurrency:
  group: data-branch
  cancel-in-progress: false

# Anything not listed here is "none", and GitHub's search then leaves pull
# requests out for this token: without pull-requests: read, the open PR counts
# silently came back as issue counts.
permissions:
  contents: write
  issues: write  # the status issue (nixkeeper/notify.py)
  pull-requests: read  # open PR counts (nixkeeper/sources/github.py)

jobs:
  sync:
    runs-on: ubuntu-latest
    # Usually 5 to 10 minutes. A run that hangs would hold the data branch
    # (and the hourly updates waiting for it) up to GitHub's default of 6
    # hours.
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Restore the last published data, on main
        run: bash scripts/data-branch.sh restore

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Sync package data
        run: |
          # "auto": due once the last sync is the interval old, less an hour
          # (a run started a little early still syncs): every 3 hours with
          # every package (the community instance, whose digests refresh
          # hourly), daily otherwise; NIXKEEPER_SYNC_HOURS overrides it.
          if [ "$IF_OLDER" = auto ]; then
            hours=$SYNC_HOURS
            if [ -z "$hours" ]; then
              case "${NIXKEEPER_ALL_PACKAGES,,}" in
                1 | true | yes) hours=3 ;;
                *) hours=24 ;;
              esac
            fi
            case "$hours" in
              '' | *[!0-9]*) echo "::error::NIXKEEPER_SYNC_HOURS isn't a number of hours: $hours"; exit 1 ;;
            esac
            IF_OLDER=$((hours > 1 ? hours - 1 : 0))
          fi
          nix run .#sync -- ${IF_OLDER:+--if-older "$IF_OLDER"}
        env:
          # (An input reaches the shell as a variable, never as code.)
          IF_OLDER: ${{ github.event_name == 'schedule' && 'auto' || inputs.if_older }}
          # How often to sync, in hours (a repository variable; unset: 3 with
          # every package, else 24).
          SYNC_HOURS: ${{ vars.NIXKEEPER_SYNC_HOURS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # PR/issue counts and the status issue
          NIXKEEPER_NOTIFY: github-issue  # the status issues; local runs don't notify
          # Every nixpkgs package, not only the lists' (the community
          # instance): a repository variable, so forks don't inherit it.
          NIXKEEPER_ALL_PACKAGES: ${{ vars.NIXKEEPER_ALL_PACKAGES }}
          # The issues' links: the instance's own site, when it has one
          # (otherwise its GitHub Pages address).
          NIXKEEPER_PAGE_URL: ${{ vars.CLOUDFLARE_SITE_URL }}

      - name: Publish the data if it changed
        id: publish
        run: |
          bash scripts/data-branch.sh publish "sync: package data $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      # The page with this data, to Cloudflare (a Worker serving them as
      # static assets): only for an instance with one (the community one,
      # nixkeeper.com), and only when the page or the data changed since
      # (scripts/cloudflare.sh).
      - name: Publish to Cloudflare
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        env:
          CLOUDFLARE_WORKER: ${{ vars.CLOUDFLARE_WORKER }}
          CLOUDFLARE_SITE_URL: ${{ vars.CLOUDFLARE_SITE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}  # a secret: kept out of the logs
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash scripts/cloudflare.sh deploy
