name: "Data: daily sync"

# Updates the package data the page shows (the data branch): everything, from
# every source (nixkeeper/sync.py). Also posts to the status issue. The data
# branch is main plus one commit with the data (scripts/data-branch.sh).

on:
  schedule:
    # Daily at 06:00 UTC, if the last sync is over 12 hours old: also
    # started through the API at 06:15 from outside GitHub (its schedule
    # skips runs when busy; scripts/start-runs.sh), and whichever runs second
    # stops at once.
    - cron: '0 6 * * *'
    # A catch-up: syncs only when the last sync is over 20 hours old (both
    # were skipped or badly delayed); otherwise it stops at once.
    - cron: '0 14 * * *'
  # Lets you trigger a run manually from the Actions tab (always syncs), or
  # through the API with if_older.
  workflow_dispatch:
    inputs:
      if_older:
        description: "Only if the last sync is older than this many hours (empty: always)"
        type: string
        default: ""

# The hourly updates (data-hourly.yml) also push to the data branch: never at
# the same time. A run waits for the other instead of cancelling it.
concurrency:
  group: data-branch
  cancel-in-progress: false

# Anything not listed here is "none", and GitHub's search then leaves pull
# requests out for this token: without pull-requests: read, the open PR counts
# silently came back as issue counts.
permissions:
  contents: write
  issues: write  # the status issue (nixkeeper/notify.py)
  pull-requests: read  # open PR counts (nixkeeper/sources/github.py)

jobs:
  sync:
    runs-on: ubuntu-latest
    # Usually 5 to 10 minutes. A run that hangs would hold the data branch
    # (and the hourly updates waiting for it) up to GitHub's default of 6
    # hours.
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Restore the last published data, on main
        run: bash scripts/data-branch.sh restore

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Sync package data
        run: nix run .#sync -- ${IF_OLDER:+--if-older "$IF_OLDER"}
        env:
          # (An input reaches the shell as a variable, never as code.)
          IF_OLDER: ${{ github.event.schedule == '0 14 * * *' && '20' || github.event.schedule == '0 6 * * *' && '12' || inputs.if_older }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # PR/issue counts and the status issue
          NIXKEEPER_NOTIFY: github-issue  # the status issue; local runs don't notify
          # Every nixpkgs package, not only the lists' (the community
          # instance): a repository variable, so forks don't inherit it.
          NIXKEEPER_ALL_PACKAGES: ${{ vars.NIXKEEPER_ALL_PACKAGES }}

      - name: Publish the data if it changed
        run: |
          bash scripts/data-branch.sh publish "sync: package data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
