name: "Data: daily sync"

# Updates the package data the page shows (the data branch): everything, from
# every source (nixkeeper/__main__.py). Also posts to the status issue.

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC
  workflow_dispatch: {}    # lets you trigger a run manually from the Actions tab

# The hourly updates (data-hourly.yml) also push to the data branch: never at
# the same time. A run waits for the other instead of cancelling it.
concurrency:
  group: data-branch
  cancel-in-progress: false

# Anything not listed here is "none", and GitHub's search then leaves pull
# requests out for this token: without pull-requests: read, the open PR counts
# silently came back as issue counts.
permissions:
  contents: write
  issues: write  # the status issue (nixkeeper/notify.py)
  pull-requests: read  # open PR counts (nixkeeper/sources/github.py)

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0   # full history so the rebase below has something to work with

      - name: Prepare data branch
        run: |
          git config user.name "nixkeeper-bot"
          git config user.email "nixkeeper-bot@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin data > /dev/null 2>&1; then
            # data branch exists: bring its accumulated history forward,
            # replayed on top of main's current tip.
            git fetch origin data
            git checkout -b data origin/data
            git rebase origin/main
          else
            # first run: nothing to rebase yet, just branch off main.
            git checkout -B data
          fi

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Sync package data
        run: nix run .#sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # PR/issue counts and the status issue
          NIXKEEPER_NOTIFY: github-issue  # the status issue; local runs don't notify

      - name: Commit and push if anything changed
        run: |
          git add -f data/
          if git diff --cached --quiet; then
            echo "No package changes since last run."
            exit 0
          fi
          git commit -m "sync: package data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force-with-lease origin data
