name: "Community: update checks still work"

# Tries the community rules (community/) for real: the update checks against
# nixpkgs' current versions, the ignore rules against the bot's latest
# attempts, and the up-to-date rules against nixpkgs and Repology. Their
# format and limits are checked by CI (nix flake check) already; this is
# whether they still do something.
#
#   weekly (and by hand), in iedame/nixkeeper only: every rule, kept in the
#     "Community rules status" issue: which update checks are broken and
#     since when (with a comment when one breaks or works again), and which
#     ignore and up-to-date rules can go. Neither fails the run.
#   on pull requests changing community/: only the rules they add or change,
#     failing if an update check finds nothing, an ignore rule doesn't match
#     the bot's latest failed attempt, or an up-to-date rule doesn't match
#     what nixpkgs and Repology show.

on:
  schedule:
    - cron: '41 7 * * 1'   # Mondays, 07:41 UTC
  pull_request:
    paths:
      - 'community/**'
  workflow_dispatch: {}

permissions:
  contents: read  # reads the code; GitHub rules query public repositories

jobs:
  report:
    # Only where the community file is maintained: a copy of the repository
    # for someone's own dashboard doesn't look after it.
    if: github.event_name != 'pull_request' && github.repository == 'iedame/nixkeeper'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write  # the community rules status issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # never pushes

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Try every community rule, and update the status issue
        run: nix run .#community-check -- --report-issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # GitHub rules, and the issue

  pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # never pushes

      - name: Get main's community rules, to compare with
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE"
          mkdir -p "$RUNNER_TEMP/base"
          for file in update-checks.nix ignored-updates.nix up-to-date.nix; do
            git show "FETCH_HEAD:community/$file" > "$RUNNER_TEMP/base/$file" \
              || echo '{ }' > "$RUNNER_TEMP/base/$file"
          done

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Try the rules this pull request adds or changes
        run: nix run .#community-check -- --changed-from "$RUNNER_TEMP/base"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # GitHub rules
