<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nixkeeper — your nixpkgs packages, at a glance</title>
<meta name="description" content="Health dashboard for the nixpkgs packages you maintain: new releases, build and update failures, and vulnerabilities, in one place.">
<!-- Link previews (Discourse, Matrix, Mastodon, ...): nixkeeper's card. A
     full address, as previews need: the project's, for every copy. -->
<meta property="og:type" content="website">
<meta property="og:title" content="nixkeeper — your nixpkgs packages, at a glance">
<meta property="og:description" content="Health dashboard for the nixpkgs packages you maintain: new releases, build and update failures, and vulnerabilities, in one place.">
<meta property="og:image" content="https://raw.githubusercontent.com/iedame/nixkeeper/main/assets/screenshots/social-preview.png">
<meta property="og:image:width" content="2560">
<meta property="og:image:height" content="1280">
<meta property="og:image:alt" content="nixkeeper: the logo, what it watches (new releases, build and update failures, vulnerabilities), and the dashboard">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" id="favicon" href="favicon.svg" type="image/svg+xml">
<script src="theme.js"></script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="catppuccin.css">
</head>
<body>
<div class="shell">

  <div class="sticky-top" id="stickyTop">
  <header class="top">
    <div class="wordmark">
      <h1><img class="lockup on-light" src="nixkeeper-lockup-tight.svg" alt="nixkeeper" width="143" height="28"><img class="lockup on-dark" src="nixkeeper-lockup-tight-dark.svg" alt="nixkeeper" width="143" height="28"></h1>
      <span class="tag">your nixpkgs packages, at a glance</span>
    </div>
    <div class="actions">
      <label class="search">
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="search" placeholder="Filter pkgs" aria-label="Filter packages" disabled>
        <kbd title="Press / to filter">/</kbd>
      </label>
      <button type="button" class="btn icon-btn" id="sortBtn" aria-pressed="false" aria-label="Sort A–Z" title="Sort alphabetically instead of by what needs attention">
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 16 4 4 4-4"/><path d="M7 20V4"/><path d="M15 10V6.5a2.5 2.5 0 0 1 5 0V10"/><path d="M15 8h5"/><path d="M15 14h5l-5 6h5"/></svg>
      </button>
      <div class="theme">
        <button type="button" class="btn icon-btn" id="themeBtn" aria-expanded="false" aria-controls="themePanel" aria-label="Theme" title="Theme">
          <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13.5" cy="6.5" r="1" fill="currentColor"/><circle cx="17.5" cy="10.5" r="1" fill="currentColor"/><circle cx="8.5" cy="7.5" r="1" fill="currentColor"/><circle cx="6.5" cy="12.5" r="1" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.93 0 1.65-.75 1.65-1.69 0-.44-.18-.84-.44-1.13-.29-.29-.44-.65-.44-1.13a1.64 1.64 0 0 1 1.67-1.67h2c3.05 0 5.55-2.5 5.55-5.55C21.97 6.01 17.46 2 12 2z"/></svg>
        </button>
        <div class="theme-panel" id="themePanel" hidden>
          <fieldset>
            <legend>Colours</legend>
            <div class="choices">
              <label><input type="radio" name="palette" value="classic">Classic</label>
              <label><input type="radio" name="palette" value="catppuccin">Catppuccin</label>
            </div>
          </fieldset>
          <fieldset>
            <legend>Light or dark</legend>
            <div class="choices">
              <label><input type="radio" name="mode" value="auto">Auto</label>
              <label><input type="radio" name="mode" value="light">Light</label>
              <label><input type="radio" name="mode" value="dark">Dark</label>
            </div>
          </fieldset>
        </div>
      </div>
    </div>
  </header>

  <div class="stick-mark" id="stickMark"></div>
  <div class="filterbar" id="filterbar">
    <div class="filters">
      <div class="chips" id="stats"></div>
      <div class="chips lists" id="lists"></div>
    </div>
    <span class="checked" id="checked"></span>
  </div>
  </div>
  <div class="list-problems" id="listProblems" hidden></div>
  <div id="content">
    <div class="loading">Loading package data…</div>
  </div>

  <footer class="legend">
    <span><span class="status-dot ok"></span> newest</span>
    <span><span class="status-dot warn"></span> outdated</span>
    <span><span class="status-dot missing"></span> not in nixpkgs unstable</span>
    <span><span class="status-dot neutral"></span> rolling / other scheme</span>
    <span class="about" id="about">
      <a class="files-link" href="https://github.com/iedame/nixkeeper/blob/main/docs/reading-the-page.md" target="_blank" rel="noopener">what these mean ↗</a>
      <a class="files-link" href="https://github.com/iedame/nixkeeper" target="_blank" rel="noopener">nixkeeper: source and how it works ↗</a>
    </span>
  </footer>

</div>

<div id="announce" class="sr-only" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
