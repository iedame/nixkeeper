<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nixkeeper — nixpkgs unstable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">

  <header class="top">
    <div class="wordmark">
      <h1><span class="dot">▪</span> nixkeeper</h1>
      <span class="tag">nixpkgs unstable, checked against every other repo</span>
    </div>
    <div class="actions">
      <input type="search" id="search" placeholder="Filter packages…" aria-label="Filter packages" disabled>
      <button class="btn" id="sortBtn" aria-pressed="false" title="Sort alphabetically instead of by what needs attention">A–Z</button>
      <button class="btn" id="refreshBtn">Refresh</button>
    </div>
  </header>

  <div class="stats" id="stats"></div>
  <div id="content">
    <div class="loading">Loading package data…</div>
  </div>

  <footer class="legend">
    <span><span class="status-dot ok"></span> newest</span>
    <span><span class="status-dot warn"></span> outdated</span>
    <span><span class="status-dot missing"></span> not in nixpkgs unstable</span>
    <span><span class="status-dot neutral"></span> rolling / other scheme</span>
  </footer>

</div>

<script src="app.js"></script>
</body>
</html>
