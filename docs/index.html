<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nixkeeper — nixpkgs unstable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f7f8; --surface: #ffffff; --ink: #14171a; --ink-soft: #565c63; --ink-faint: #90959b;
    --hairline: #e3e5e8; --hairline-strong: #d2d5d9;
    --accent: #3654c9;
    --ok: #1f8a5f; --ok-soft: #e7f4ee; --ok-devel: #135c3e;
    --warn: #b8730a; --warn-soft: #fbf1e1; --warn-devel: #7d4e05;
    --stale: #8b8f94; --stale-soft: #eeeeef;
    --danger: #c4433a; --danger-soft: #fbe9e7;
    --radius: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c; --surface: #1d2025; --ink: #edeff2; --ink-soft: #a3a8b0; --ink-faint: #6c7178;
      --hairline: #2b2f35; --hairline-strong: #383d44; --accent: #7b8cef;
      --ok: #4fc793; --ok-soft: #1b2e27; --warn: #e0a344; --warn-soft: #332714;
      --ok-devel: #2e9466; --warn-devel: #a8762b;
      --stale: #82868c; --stale-soft: #24262a; --danger: #e0776e; --danger-soft: #33201e;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Instrument Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .shell { max-width: 1280px; margin: 0 auto; padding: 28px 20px 80px; }

  header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding-bottom: 18px; border-bottom: 1px solid var(--hairline-strong); flex-wrap: wrap; }
  .wordmark { display: flex; align-items: baseline; gap: 10px; }
  .wordmark .dot { color: var(--accent); }
  .wordmark h1 { font-size: 19px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .wordmark .tag { color: var(--ink-faint); font-size: 13px; }

  .actions { display: flex; align-items: center; gap: 8px; }
  input[type="search"] {
    font-family: inherit; font-size: 14px; padding: 8px 12px; width: 170px;
    border: 1px solid var(--hairline-strong); border-radius: var(--radius);
    background: var(--surface); color: var(--ink); outline: none;
  }
  input[type="search"]:focus { border-color: var(--accent); }
  .btn { font-family: inherit; font-size: 13px; font-weight: 500; padding: 7px 12px; border-radius: var(--radius); border: 1px solid var(--hairline-strong); background: var(--surface); color: var(--ink-soft); cursor: pointer; }
  .btn:hover { color: var(--ink); }
  .btn:focus-visible, input:focus-visible, .row:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .stats { display: flex; align-items: center; gap: 6px; padding: 12px 0 16px; color: var(--ink-soft); font-size: 13px; flex-wrap: wrap; }
  .stats b { color: var(--ink); font-weight: 600; }
  .stat-btn { font: inherit; color: inherit; background: none; border: 1px solid transparent; border-radius: var(--radius); padding: 4px 9px; cursor: pointer; }
  .stat-btn:hover:not(:disabled) { background: var(--surface); border-color: var(--hairline); }
  .stat-btn[aria-pressed="true"] { background: var(--surface); border-color: var(--hairline-strong); color: var(--ink); }
  .stat-btn:disabled { cursor: default; opacity: .6; }
  .stat-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .stats .checked { margin-left: auto; color: var(--ink-faint); }
  .stats .checked.stale { color: var(--danger); }

  table { width: 100%; border-collapse: collapse; }
  thead th { text-align: left; font-size: 12px; font-weight: 500; color: var(--ink-faint); padding: 0 10px 8px; border-bottom: 1px solid var(--hairline); }
  .wrap { overflow-x: auto; }
  tbody tr.row { cursor: pointer; border-bottom: 1px solid var(--hairline); }
  tbody tr.row:hover { background: var(--surface); }
  tbody tr.row td { padding: 12px 10px; vertical-align: middle; }

  .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
  .status-dot.ok { background: var(--ok); } .status-dot.warn { background: var(--warn); }
  .status-dot.missing { background: var(--danger); } .status-dot.neutral { background: var(--ink-faint); }

  .pkg-name { display: flex; align-items: center; gap: 10px; }
  .pkg-name .n { font-weight: 600; font-size: 14.5px; white-space: nowrap; }
  .plat { font-size: 10.5px; font-weight: 500; padding: 1px 6px; border-radius: 4px; background: var(--stale-soft); color: var(--ink-soft); }
  .plat + .plat { margin-left: -5px; }
  .plat.any { color: var(--ink-faint); }

  .ver { font-size: 13px; white-space: nowrap; }
  .ver .ref { color: var(--ink-faint); }
  .badge { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 20px; font-weight: 500; margin-left: 5px; }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.devel.ok { background: var(--ok-soft); color: var(--ok-devel); }
  .badge.devel.warn { background: var(--warn-soft); color: var(--warn-devel); }
  .badge.missing { background: var(--danger-soft); color: var(--danger); }
  .badge.vuln { background: var(--danger-soft); color: var(--danger); }
  .badge.neutral { background: var(--stale-soft); color: var(--ink-soft); }

  .failure-btn { font: inherit; font-size: 12.5px; color: var(--ink-soft); background: none; border: 1px solid transparent; border-radius: var(--radius); padding: 4px 9px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .failure-btn:hover { background: var(--bg); border-color: var(--hairline); color: var(--ink); }
  .failure-btn.failing { color: var(--danger); }
  .gh-links { display: inline-flex; gap: 6px; }
  .gh-btn { font-size: 12px; color: var(--ink-soft); text-decoration: none; border: 1px solid var(--hairline); border-radius: 6px; padding: 3px 8px; white-space: nowrap; display: inline-flex; gap: 5px; align-items: baseline; }
  .gh-btn:hover { border-color: var(--hairline-strong); color: var(--ink); background: var(--bg); }
  .gh-btn b { font-weight: 600; color: var(--ink); }
  .chev { color: var(--ink-faint); font-size: 12px; transition: transform .15s; }
  tr.row.open .chev { transform: rotate(90deg); }

  tr.detail { display: none; } tr.detail.open { display: table-row; }
  tr.detail td { padding: 4px 10px 18px 10px; border-bottom: 1px solid var(--hairline); }
  .detail-inner { padding-left: 18px; }
  .nix-line { font-size: 14px; margin-bottom: 10px; }
  .other-label { font-size: 11.5px; color: var(--ink-faint); margin: 2px 0 6px; }
  .repo-chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .repo-chip { font-size: 12.5px; padding: 4px 9px; border-radius: 6px; background: var(--bg); border: 1px solid var(--hairline); color: var(--ink-soft); display: inline-flex; gap: 6px; align-items: baseline; }
  .repo-chip .v { color: var(--ink); }
  .repo-chip.ahead .v { color: var(--warn); }
  .detail-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .files-link { font-size: 13px; color: var(--accent); text-decoration: none; font-weight: 500; }
  .files-link:hover { text-decoration: underline; }
  .loading, .empty, .error { color: var(--ink-faint); font-size: 13px; padding: 30px 4px; text-align: center; }
  .error { color: var(--danger); }
  .error code { background: var(--bg); padding: 1px 5px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 12px; }

  footer.legend { display: flex; gap: 16px; padding-top: 20px; margin-top: 8px; border-top: 1px solid var(--hairline); font-size: 12.5px; color: var(--ink-faint); flex-wrap: wrap; }
  footer.legend span { display: inline-flex; align-items: center; gap: 6px; }

  @media (max-width: 640px) { input[type="search"] { width: 120px; } }
</style>
</head>
<body>
<div class="shell">

  <header class="top">
    <div class="wordmark">
      <h1><span class="dot">▪</span> nixkeeper</h1>
      <span class="tag">nixpkgs unstable, checked against every other repo</span>
    </div>
    <div class="actions">
      <input type="search" id="search" placeholder="Filter packages…" aria-label="Filter packages" disabled>
      <button class="btn" id="refreshBtn">Refresh</button>
    </div>
  </header>

  <div class="stats" id="stats"></div>
  <div id="content">
    <div class="loading">Loading package data…</div>
  </div>

  <footer class="legend">
    <span><span class="status-dot ok"></span> newest</span>
    <span><span class="status-dot warn"></span> outdated</span>
    <span><span class="status-dot missing"></span> not in nixpkgs unstable</span>
    <span><span class="status-dot neutral"></span> rolling / other scheme</span>
  </footer>

</div>

<script>
const NIX_REPO = 'nix_unstable';

// Figure out which repo's data branch to read. Works unmodified on a
// GitHub Pages project site (https://<owner>.github.io/<repo>/); override
// with ?owner=...&repo=... when testing locally or on a custom domain.
function detectRepo() {
  const params = new URLSearchParams(location.search);
  if (params.get('owner') && params.get('repo')) {
    return { owner: params.get('owner'), repo: params.get('repo') };
  }
  const stored = localStorage.getItem('nixkeeper:repo');
  if (stored) { try { return JSON.parse(stored); } catch (e) {} }

  const host = location.hostname;
  const owner = host.endsWith('.github.io') ? host.split('.')[0] : null;
  const seg = location.pathname.split('/').filter(Boolean)[0] || null;
  if (owner && seg) return { owner, repo: seg };
  return null;
}

function rawUrl(owner, repo, path) {
  return `https://raw.githubusercontent.com/${owner}/${repo}/data/${path}`;
}

let repoInfo = detectRepo();
const detailCache = new Map(); // name -> parsed per-package Repology JSON
let packages = [];
let checkedAt = null;
let activeFilter = 'all'; // 'all' | 'warn' | 'missing' | 'vuln'
// The sync runs daily; older than this means runs are failing or GitHub has
// paused the schedule (it does after 60 days without commits).
const STALE_AFTER_HOURS = 48;

const FILTERS = {
  all:     { label: 'tracked',         test: () => true },
  warn:    { label: 'outdated',        color: 'var(--warn)',   test: p => computeStatus(p) === 'warn' },
  missing: { label: 'not in nixpkgs',  color: 'var(--danger)', test: p => computeStatus(p) === 'missing' },
  vuln:    { label: 'flagged vulnerable', color: 'var(--danger)', test: p => p.nixVulnerable },
};

async function loadIndex() {
  const content = document.getElementById('content');
  if (!repoInfo) {
    content.innerHTML = `<div class="error">
      Couldn't tell which GitHub repo to read from this URL.<br>
      Add <code>?owner=you&repo=your-repo</code> to the address, or open this from your GitHub Pages project site.
    </div>`;
    return;
  }
  try {
    const res = await fetch(rawUrl(repoInfo.owner, repoInfo.repo, 'data/index.json'), { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    packages = data.packages || [];
    checkedAt = data.checkedAt || null;
    document.getElementById('search').disabled = false;
    render(currentFiltered());
  } catch (err) {
    content.innerHTML = `<div class="error">
      Couldn't load <code>data/index.json</code> from the <code>data</code> branch of
      <code>${escapeHtml(repoInfo.owner)}/${escapeHtml(repoInfo.repo)}</code>.<br>
      Check that the repo is public and the sync workflow has run at least once.
    </div>`;
  }
}

// Follows Repology's statuses. "legacy" means outdated while the same repo
// carries a newer version in another package (e.g. a beta overtaken by the
// stable release), so it counts as outdated. Whether a row is a devel variant
// comes separately from pkg.devel and only shades its "devel" badge.
function computeStatus(pkg) {
  if (pkg.nixStatus === 'missing') return 'missing';
  if (pkg.nixStatus === 'outdated' || pkg.nixStatus === 'legacy') return 'warn';
  if (pkg.nixStatus === 'newest' || pkg.nixStatus === 'unique' || pkg.nixStatus === 'devel') return 'ok';
  return 'neutral';
}

function timeAgo(iso) {
  if (!iso) return 'never';
  const diff = Date.now() - new Date(iso).getTime();
  const m = Math.floor(diff / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm ago';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h ago';
  return Math.floor(h / 24) + 'd ago';
}

function renderStats() {
  const buttons = Object.entries(FILTERS).map(([key, f]) => {
    const count = packages.filter(f.test).length;
    // "vulnerable" only shows up when something is actually flagged.
    if (key === 'vuln' && !count && activeFilter !== 'vuln') return '';
    const pressed = activeFilter === key;
    return `<button class="stat-btn" data-filter="${key}" aria-pressed="${pressed}"
      ${!count && key !== 'all' && !pressed ? 'disabled' : ''}>
      <b${f.color ? ` style="color:${f.color}"` : ''}>${count}</b> ${f.label}</button>`;
  }).join('');
  const stale = !checkedAt || Date.now() - new Date(checkedAt).getTime() > STALE_AFTER_HOURS * 3600e3;
  document.getElementById('stats').innerHTML = `${buttons}<span class="checked${stale ? ' stale' : ''}"
    ${stale ? 'title="The daily sync hasn\'t updated the data in over 2 days. Check the workflow in the Actions tab."' : ''}>
    checked ${timeAgo(checkedAt)}${stale ? ' — sync may be failing' : ''}</span>`;
}

function escapeHtml(s) { return (s || '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function render(list) {
  renderStats();
  const content = document.getElementById('content');
  if (!list.length) {
    content.innerHTML = `<div class="empty">No packages match${activeFilter !== 'all' && !document.getElementById('search').value.trim() ? ` the “${FILTERS[activeFilter].label}” filter` : ''}.</div>`;
    return;
  }
  content.innerHTML = `<div class="wrap"><table>
    <thead><tr>
      <th style="padding-left:10px">Package</th><th>nixpkgs unstable</th><th>open on GitHub</th><th>build failures</th><th>update failures</th><th aria-hidden="true"></th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table></div>`;

  const rowsEl = document.getElementById('rows');
  list.forEach(pkg => {
    const st = computeStatus(pkg);
    const verCell = st === 'missing' ? `<span class="badge missing">not packaged</span>`
      : `${escapeHtml(pkg.nixVersion)}${st === 'warn' ? ` <span class="ref mono">→ ${escapeHtml(pkg.refVersion || '?')}</span>` : ''}${st === 'neutral' ? ` <span class="badge neutral">${escapeHtml(pkg.nixStatus)}</span>` : ''}${pkg.devel ? ` <span class="badge devel ${st}">devel</span>` : ''}${pkg.nixVulnerable ? ' <span class="badge vuln">vulnerable</span>' : ''}${pkg.staleSince ? ` <span class="badge neutral" title="Repology lookup failed on the last run; this is data from ${escapeHtml(new Date(pkg.staleSince).toLocaleString())}">not refreshed</span>` : ''}`;

    const tr = document.createElement('tr');
    tr.className = 'row'; tr.tabIndex = 0;
    tr.innerHTML = `
      <td><div class="pkg-name"><span class="status-dot ${st}"></span><span class="n">${escapeHtml(pkg.name)}</span>${platformTags(pkg)}</div></td>
      <td class="ver mono">${verCell}</td>
      <td>${githubLinks(pkg)}</td>
      <td>${failureCell('build', pkg.buildFailure)}</td>
      <td>${failureCell('update', pkg.updateFailure)}</td>
      <td><span class="chev">▸</span></td>
    `;

    const detail = document.createElement('tr');
    detail.className = 'detail';
    detail.innerHTML = `<td colspan="6"><div class="detail-inner">
      <div class="nix-line">Loading detail…</div>
    </div></td>`;

    tr.querySelectorAll('.failure-btn').forEach(btn => btn.addEventListener('click', e => {
      e.stopPropagation(); // don't expand the row
      const url = FAILURE_URLS[btn.dataset.kind](pkg);
      if (url) window.open(url, '_blank', 'noopener');
    }));

    tr.querySelectorAll('.gh-btn').forEach(a => a.addEventListener('click', e => e.stopPropagation()));

    tr.addEventListener('click', async () => {
      const isOpen = tr.classList.toggle('open');
      detail.classList.toggle('open', isOpen);
      if (isOpen) await fillDetail(pkg, detail.querySelector('.detail-inner'));
    });
    tr.addEventListener('keydown', e => { if (e.target === tr && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); tr.click(); } });

    rowsEl.appendChild(tr);
    rowsEl.appendChild(detail);
  });
}

// Placeholders until failure data exists: the fetch script doesn't produce
// `buildFailure` / `updateFailure` yet, so every package reads as passing.
function failureCell(kind, failing) {
  return `<button class="failure-btn${failing ? ' failing' : ''}" type="button" data-kind="${kind}">
    <span class="status-dot ${failing ? 'missing' : 'ok'}"></span>${failing ? 'failure reported' : 'none reported'}</button>`;
}

// TODO: link each kind to its log once we have one (build: e.g. Hydra).
const FAILURE_URLS = {
  build: pkg => null,
  update: pkg => null,
};

// From nixpkgs meta.platforms; null means nixpkgs doesn't restrict it.
function platformTags(pkg) {
  const pl = pkg.platforms;
  if (pl === undefined) return '';
  if (pl === null) return `<span class="plat any" title="nixpkgs doesn't restrict its platforms">any platform</span>`;
  return (pl.linux ? `<span class="plat">Linux</span>` : '') + (pl.darwin ? `<span class="plat">macOS</span>` : '');
}

// Open nixpkgs PRs / issues with the package's attribute name in the title. Counts come from
// the fetch script's GitHub search; without them the buttons are plain links.
function githubLinks(pkg) {
  const term = pkg.searchTerm || pkg.name;
  const link = (kind, path, label, count) => {
    const q = encodeURIComponent(`is:${kind} state:open in:title ${term}`);
    return `<a class="gh-btn" href="https://github.com/NixOS/nixpkgs/${path}?q=${q}" target="_blank" rel="noopener"
      title="Open nixpkgs ${label} with ${escapeHtml(term)} in the title">${label}${count != null ? ` <b>${count}</b>` : ''}</a>`;
  };
  return `<span class="gh-links">${link('pr', 'pulls', 'PRs', pkg.openPRs)}${link('issue', 'issues', 'issues', pkg.openIssues)}</span>`;
}

async function fillDetail(pkg, el) {
  // Raw Repology data is stored per project, under a file-name-safe version
  // of its name (python:requests -> python_requests.json).
  const file = pkg.dataFile || `${pkg.project || pkg.name}.json`;
  let entries = detailCache.get(file);
  if (!entries) {
    try {
      const res = await fetch(rawUrl(repoInfo.owner, repoInfo.repo, `data/${encodeURIComponent(file)}`), { cache: 'no-store' });
      entries = res.ok ? await res.json() : [];
      detailCache.set(file, entries);
    } catch (e) { entries = []; }
  }

  const others = entries.filter(e => e.repo !== NIX_REPO);
  const homepage = pkg.homepage;

  const st = computeStatus(pkg);
  const nixLine = st === 'missing'
    ? `Not found in <span class="mono">nix_unstable</span> — nixpkgs doesn't currently package this.`
    : `nixpkgs unstable has <span class="mono" style="font-weight:600">${escapeHtml(pkg.nixVersion)}</span>${st === 'warn' ? `, the newest seen elsewhere is <span class="mono" style="font-weight:600;color:var(--warn)">${escapeHtml(pkg.refVersion || '?')}</span>`
      : st === 'neutral' ? ` — Repology classifies this version as <span class="mono">${escapeHtml(pkg.nixStatus)}</span>.`
      : ` — matches the newest ${pkg.devel ? 'devel ' : ''}version seen vs. ${pkg.repoCount} other ${pkg.repoCount === 1 ? 'repo' : 'repos'}.`}`;

  el.innerHTML = `
    <div class="nix-line">${nixLine}</div>
    ${others.length ? `<div class="other-label">Compared against</div><div class="repo-chips">
      ${others.map(e => `<span class="repo-chip ${e.status === 'newest' && e.version !== pkg.nixVersion ? 'ahead' : ''}">${escapeHtml(e.repo)} <span class="v mono">${escapeHtml(e.version || '?')}</span></span>`).join('')}
    </div>` : ''}
    <div class="detail-row">
      ${homepage ? `<a class="files-link" href="${escapeHtml(homepage)}" target="_blank" rel="noopener">Homepage →</a>` : ''}
      ${pkg.project ? `<a class="files-link" href="https://repology.org/project/${encodeURIComponent(pkg.project)}/versions" target="_blank" rel="noopener">View on Repology ↗</a>` : ''}
    </div>
  `;
}

function currentFiltered() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  return packages.filter(p => FILTERS[activeFilter].test(p) && (!q || [p.name, p.project, ...(p.attrs || [])].some(n => n && n.toLowerCase().includes(q))));
}

document.getElementById('stats').addEventListener('click', e => {
  const btn = e.target.closest('.stat-btn');
  if (!btn) return;
  // Clicking the active filter again goes back to showing everything.
  activeFilter = btn.dataset.filter === activeFilter ? 'all' : btn.dataset.filter;
  render(currentFiltered());
});

document.getElementById('search').addEventListener('input', () => render(currentFiltered()));
document.getElementById('refreshBtn').addEventListener('click', () => {
  detailCache.clear();
  document.getElementById('content').innerHTML = `<div class="loading">Loading package data…</div>`;
  loadIndex();
});

loadIndex();
</script>
</body>
</html>
