[build-system]
requires = ["setuptools>=77"]  # license as an SPDX expression
build-backend = "setuptools.build_meta"

[project]
name = "nixkeeper"
version = "0.2.0"
description = "Tracks how nixpkgs unstable compares to other repos, for a curated set of packages"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["brotli"]

[project.scripts]
nixkeeper-sync = "nixkeeper.__main__:main"
nixkeeper-quick-check = "nixkeeper.quick:main"

[tool.setuptools.packages.find]
include = ["nixkeeper*"]

[tool.ruff]
line-length = 88  # Python's standard (Black / ruff default)

[tool.ruff.lint]
# pycodestyle, pyflakes, bugbear, pyupgrade, simplify, isort
select = ["E", "F", "W", "B", "UP", "SIM", "I"]
