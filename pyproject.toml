[build-system]
requires = ["setuptools>=77"]  # license as an SPDX expression
build-backend = "setuptools.build_meta"

[project]
name = "nixkeeper"
version = "0.6.0"
description = "Health dashboard for the nixpkgs packages you maintain: new releases, build and update failures, and vulnerabilities, in one place."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["brotli"]

[project.scripts]
nixkeeper-sync = "nixkeeper.__main__:main"
nixkeeper-frequent-check = "nixkeeper.frequent:main"
nixkeeper-pr-check = "nixkeeper.prcheck:main"

[tool.setuptools.packages.find]
include = ["nixkeeper*"]

[tool.ruff]
line-length = 88  # Python's standard (Black / ruff default)

[tool.ruff.lint]
# pycodestyle, pyflakes, bugbear, pyupgrade, simplify, isort
select = ["E", "F", "W", "B", "UP", "SIM", "I"]
